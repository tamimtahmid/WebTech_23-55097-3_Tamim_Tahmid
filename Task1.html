<body>
<h1>Registration Form</h1>

<div>

<div>

<option value="EEE">EEE</option>
<option value="IPE">IPE</option>
</select></div><br><br>
<div>

</div><br>

<div>
<input type="submit" value="Register">

</div>
</form>
</body>
